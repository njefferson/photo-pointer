name: GNIS ingest (USGS named natural features)

# Source #3: fetches named natural features (waterfalls, arches, caves, hot
# springs) in the region from the USGS GNIS geonames service (The National Map,
# US public domain), re-merges into the region's spots (the merge is
# TAG-PRESERVING so existing enrichment survives), validates, and commits.
# Dispatch via actions_run_trigger.
#
# No API key. The geonames ArcGIS REST service is unreachable from the sandbox
# (egress 403s the CONNECT), so this runs on a runner.

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region id (see config/regions.json)
        default: sac-eldorado-placer
concurrency:
  group: gnis-${{ github.ref }}-${{ github.event.inputs.region || 'default' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      REGION: ${{ github.event.inputs.region || 'sac-eldorado-placer' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch GNIS named natural features (public domain)
        run: node ingest/ingest.mjs gnis "$REGION"
      - name: Re-merge (tag-preserving) + validate
        run: |
          node ingest/ingest.mjs merge "$REGION"
          node ingest/ingest.mjs validate "$REGION"
      - name: Commit
        run: |
          git config user.name "photo-pointer ingest"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Add GNIS named natural features: waterfalls, arches, caves, hot springs" -m "Named natural features from the USGS Geographic Names Information System (The National Map, US public domain) — waterfalls, natural arches, caves and hot springs — folded in as their own pin types, each linking to its USGS gazetteer entry."
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*5)); done
