name: Ingest OSM (scheduled, quiet hours)

# Finish the OpenStreetMap sweep for a region across as many quiet nights as it
# takes — and STOP when it is done. That is the standing requirement, and both
# halves are load-bearing: run inside THEIR low-traffic hours, and terminate on
# completion rather than firing forever against a region that is already built.
#
# WHY 01:23 UTC — THEIR quiet hours, not ours. All three public Overpass mirrors
# are Central European (overpass-api.de in Germany; kumi.systems and
# private.coffee in Austria), so there is exactly one timezone worth aiming at.
# Cron is fixed UTC while their clocks shift, so the time has to sit inside the
# overnight trough in BOTH seasons:
#     01:23 UTC  =  03:23 CEST (summer)  /  02:23 CET (winter)
# An earlier version used 03:23 UTC, which is 05:23 CEST — the tail of the quiet
# window, right as Europe starts waking. This sits in the middle of it instead.
# It happens to be 18:23 in Sacramento, which is neither here nor there: the
# point is when THEIR servers are idle, not when we are asleep.
# The :23 is deliberate too — cron entries pile up on the hour, and joining that
# stampede is the opposite of quiet.
#
# HOW IT STOPS. Every firing asks scripts/osm-schedule.mjs first, which answers
# from committed state:
#   run/refresh → do the work
#   complete    → exit in seconds having asked Overpass NOTHING
#   exhausted   → seven failed nights means stop and let a person look
# So the cron stays armed as a monthly freshness check rather than a nightly
# re-fetch, and a region that is finished costs one trivial no-op job.

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: Region id (see config/regions.json)
        default: sac-eldorado-placer

concurrency:
  group: ingest-osm-${{ github.ref }}-${{ github.event.inputs.region || 'sac-eldorado-placer' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      REGION: ${{ github.event.inputs.region || 'sac-eldorado-placer' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # THE GATE. In the normal case this is the whole job.
      - name: Is there anything to do?
        id: gate
        run: |
          out="$(node scripts/osm-schedule.mjs decide "$REGION")"
          echo "$out"
          action="$(echo "$out" | sed -n 's/^::set-action:://p')"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Nothing to do
        if: steps.gate.outputs.action == 'complete'
        run: echo "Already complete for this region as currently defined. Overpass was not contacted."

      - name: Give up
        if: steps.gate.outputs.action == 'exhausted'
        run: |
          echo "::warning::Too many failed nights for $REGION. The schedule has stopped asking."
          echo "Re-run by hand once the cause is understood; that resets the count."

      # Record the attempt BEFORE the work, so a job that is killed at the
      # timeout still counts as a try. Otherwise a run that always times out
      # would never reach the cap and would poke Overpass every night forever.
      - name: Count this attempt
        if: steps.gate.outputs.action == 'run' || steps.gate.outputs.action == 'refresh'
        run: node scripts/osm-schedule.mjs attempt "$REGION"

      - name: Fetch OSM + eBird + markers, merge + validate
        if: steps.gate.outputs.action == 'run' || steps.gate.outputs.action == 'refresh'
        run: node ingest/ingest.mjs all "$REGION"

      - name: Record that it finished
        if: success() && (steps.gate.outputs.action == 'run' || steps.gate.outputs.action == 'refresh')
        run: node scripts/osm-schedule.mjs done "$REGION"

      # Say what happened, in one sentence, somewhere a person will actually see
      # it. A sweep that spans several nights is worthless as a record if the
      # only way to learn its outcome is to open a job transcript — so the
      # outcome goes in the run's summary page AND in the commit subject, and
      # both are read from committed files rather than from this job's memory.
      - name: Where it got to
        id: status
        if: always() && (steps.gate.outputs.action == 'run' || steps.gate.outputs.action == 'refresh')
        run: |
          line="$(node scripts/osm-schedule.mjs status "$REGION")"
          echo "status=$line" >> "$GITHUB_OUTPUT"
          echo "**$REGION** — $line" >> "$GITHUB_STEP_SUMMARY"

      # Commit whether it finished or not: the attempt count and the tiles that
      # DID answer both need to survive, or the next night re-asks for work
      # Overpass has already done.
      - name: Commit
        if: always() && (steps.gate.outputs.action == 'run' || steps.gate.outputs.action == 'refresh')
        run: |
          git config user.name "photo-pointer ingest"
          git config user.email "actions@users.noreply.github.com"
          git add data/ ingest/inputs/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Overnight map sweep for $REGION: ${{ steps.status.outputs.status }}" -m "Runs in Europe's quiet hours and asks only for the map tiles it does not already have. Stops on its own once the area is complete."
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*5)); done
