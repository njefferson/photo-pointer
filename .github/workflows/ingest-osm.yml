name: Ingest OSM

# Fetches OpenStreetMap data (Overpass) for a region, adds eBird hotspots +
# historical markers, merges + validates, and commits. Runs on a GitHub runner
# because Overpass is unreachable from Claude session sandboxes.
#
# Pick the region with the `region` dispatch input (an id from
# config/regions.json; default = the home region). Fire via workflow_dispatch
# (MCP actions_run_trigger) or by committing to .github/trigger/ingest-osm.

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region id (see config/regions.json)
        default: sac-eldorado-placer
  push:
    paths:
      - '.github/trigger/ingest-osm'

concurrency:
  group: ingest-osm-${{ github.ref }}-${{ github.event.inputs.region || 'default' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Six per-county Overpass queries instead of one region-wide one, and each
    # can take a couple of minutes when the mirrors are busy. 25 was sized for a
    # three-county region asking once; it is not enough headroom now, and a job
    # that dies at the ceiling wastes every query it already made.
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      REGION: ${{ github.event.inputs.region || 'sac-eldorado-placer' }}
    steps:
      # THE CREDENTIAL IS THE POINT HERE. This job fetches from a public source
      # and COMMITS the result back, so it needs a git credential and
      # `persist-credentials: false` would break it. The job's permissions are
      # already scoped to `contents: write` and nothing else, the workflow is
      # dispatch- or schedule-triggered so no outside input reaches it, and
      # every step between the checkout and the push is this repo's own code.
      # zizmor: artipacked, declared rather than left standing.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 # zizmor: ignore[artipacked]
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Probe Overpass reachability
        run: node ingest/ingest.mjs probe
      - name: Fetch OSM + eBird + markers, merge + validate
        run: node ingest/ingest.mjs all "$REGION"
      - name: Commit data
        run: |
          git config user.name "photo-pointer ingest"
          git config user.email "actions@users.noreply.github.com"
          # ingest/inputs/ too: the tiles Overpass already answered live there,
          # and dropping them means a re-run asks a struggling service to redo
          # work it has already done. Exactly the bug commons.yml had.
          git add data/ ingest/inputs/
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Refresh map data for the $REGION region"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i * 5)); done
