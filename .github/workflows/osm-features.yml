name: OSM curiosity features ingest

# Source #2: a LIGHT Overpass query for just the curiosity feature tags
# (natural=waterfall/hot_spring/geyser/arch/cave_entrance, man_made=lighthouse,
# historic=archaeological_site/wreck), written to its own source file and merged
# in. Kept separate from the main OSM ingest, which got too heavy for Overpass's
# 300s limit when these were folded into one query. Dispatch via
# actions_run_trigger.

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region id (see config/regions.json)
        default: sac-eldorado-placer
concurrency:
  group: osm-features-${{ github.ref }}-${{ github.event.inputs.region || 'default' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      REGION: ${{ github.event.inputs.region || 'sac-eldorado-placer' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch OSM curiosity features (ODbL)
        run: node ingest/ingest.mjs osm-features "$REGION"
      - name: Re-merge (tag-preserving) + validate
        run: |
          node ingest/ingest.mjs merge "$REGION"
          node ingest/ingest.mjs validate "$REGION"
      - name: Commit
        run: |
          git config user.name "photo-pointer ingest"
          git config user.email "actions@users.noreply.github.com"
          git add data/ ingest/inputs/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Add OSM curiosity features: waterfalls, hot springs, arches and more" -m "OSM-mapped natural and historic features — waterfalls, hot springs, geysers, natural arches, cave entrances, lighthouses, archaeological sites and shipwrecks — now show as their own pin types. From OpenStreetMap (ODbL)."
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*5)); done
