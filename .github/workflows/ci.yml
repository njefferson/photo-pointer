name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

jobs:
  # EVERY HUB GATE, CALLED RATHER THAN COPIED.
  #
  # This repo ran three of the hub's nine gates. docs-check, pin-check and
  # third-person-check had never run here and all three were red when first
  # tried: a thirteen-row table in README.md that does not render on the device
  # this is read on, a package.json with no lockfile, and forty-three
  # third-person references — of which every one but four turned out to be
  # ingested OpenStreetMap text and a vendored library, now declared in
  # `.third-person-allow`.
  #
  # `pwa` IS DELIBERATELY ABSENT AND THAT IS A DEBT, NOT A SETTING. This app has
  # a service worker, so the flag belongs here; pwa-check fails it on three real
  # Doctrine §7h findings — sw.js calls skipWaiting() during install, so a new
  # worker takes over under the open page; nothing lets the reader trigger the
  # update; and nothing reads caches.keys(), so the diagnostic cannot say which
  # copy of the app a device is holding. Fixing that means building the update
  # strip a reader can see, which is a change to what people using this app
  # experience rather than a change to its wiring. Recorded in REPOS.md as owed.
  # `zizmor` likewise: the workflows here carry unpinned action references.
  hub-gates:
    uses: njefferson/noahjefferson/.github/workflows/hub-gates.yml@4a39638710907d1c413d8c14770ef4314a398a91

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: Contrast gate (WCAG, both themes)
        run: node scripts/check-contrast.mjs
      - name: Service etiquette (every networked adapter cites a policy and stays inside it)
        run: node scripts/check-etiquette.mjs
      - name: Validate committed spot data
        run: node ingest/ingest.mjs validate
