name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# NOTHING HERE WRITES. Declared rather than inherited: with no block at all a
# workflow takes the repository's default token permissions, which on this
# account includes write. zizmor: excessive-permissions.
permissions:
  contents: read

jobs:
  # EVERY HUB GATE, CALLED RATHER THAN COPIED.
  #
  # This repo ran three of the hub's nine gates. docs-check, pin-check and
  # third-person-check had never run here and all three were red when first
  # tried: a thirteen-row table in README.md that does not render on the device
  # this is read on, a package.json with no lockfile, and forty-three
  # third-person references — of which every one but four turned out to be
  # ingested OpenStreetMap text and a vendored library, now declared in
  # `.third-person-allow`.
  #
  # `pwa` IS ON as of 2026-08-30, and what it was hiding is worth recording.
  # The service worker called skipWaiting() during install and the page reloaded
  # itself the moment the new worker took control — so a deploy threw away what
  # somebody standing at a viewpoint was reading. That was written to fix a real
  # defect (a new version needed TWO force-closes) and fixed it by taking the
  # decision away from the reader. The version now waits, a standing strip says
  # so in words, and pressing it is what loads it. Watched happening against a
  # REAL second worker before this line was written — which is how the first
  # draft was caught reloading the very first visit.
  #
  # `zizmor` IS ON as of 2026-08-29. It was off because these workflows carried
  # THIRTY-FIVE unpinned action references — `@v5` and `@v3` tags, which are
  # mutable pointers somebody else controls, two of them in the job that holds a
  # live Cloudflare token. All are pinned to commits now. Every checkout that
  # does not push drops its git credential; the sixteen ingest workflows that DO
  # commit keep theirs and say why. Both workflows that lacked a `permissions:`
  # block have one. And a step output no longer expands into a `git commit -m`.
  hub-gates:
    uses: njefferson/noahjefferson/.github/workflows/hub-gates.yml@e2a5b7cb6b59311bdc7379abd0dea442edc8422f
    with:
      pwa: true
      zizmor: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Nothing in this job pushes, so the runner has no use for a git
          # credential — and one left in .git/config is available to every later
          # step, including whatever gets added next year. zizmor: artipacked.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # NEW, and it is new because this repo genuinely had no dependencies until
      # the update walk needed a browser driver. npm ci, never npm install: the
      # committed lockfile is what pins what executes on a runner (§16.1).
      - name: Install tooling
        run: npm ci

      - name: Unit tests
        run: node --test
      - name: Contrast gate (WCAG, both themes)
        run: node scripts/check-contrast.mjs
      - name: Service etiquette (every networked adapter cites a policy and stays inside it)
        run: node scripts/check-etiquette.mjs
      - name: Validate committed spot data
        run: node ingest/ingest.mjs validate

      # THE READER'S PATH THROUGH AN UPDATE, driven against a real second
      # worker. pwa-check reads the SOURCE and can tell that skipWaiting is gone
      # and a message listener exists; it cannot tell whether anybody is ever
      # shown anything, or whether pressing it works. It was green on a draft
      # that reloaded the very first visit.
      - name: Install a browser for the update walk
        run: npx --no-install playwright-core install --with-deps chromium

      - name: A new version waits, and the reader can take it
        run: npm run --silent update:walk
